[package]
name = "swd-pet"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swd_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables `tauri::tray::{TrayIconBuilder, TrayIconEvent, ...}` used by
# `tray.rs` (Task 3 — system tray + context menu + left-click behavior).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform global cursor query. Used by window.rs's click-through poller
# to read the screen cursor position every ~30ms without going through the
# webview (which receives no pointer events while the window is in pass-through
# mode on Windows). Backed by Win32 `GetCursorPos` on Windows.
device_query = "1"
# Raw FFI bindings to Win32. Used by `activity.rs::idle_since` (Task 6) to
# call `GetLastInputInfo` (last user-input tick count) and read
# `LASTINPUTINFO`. Already a transitive dep (via tauri / webview2-com, at
# v0.61.x); promoted to a direct dep here so we can `use
# windows_sys::Win32::UI::Input::KeyboardAndMouse::*` without relying on a
# transitive's exact feature set. `GetTickCount64` is declared manually
# (one-line `extern "system"`) to avoid pulling in
# `Win32_System_SystemInformation` for a single call.
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
