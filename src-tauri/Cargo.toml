[package]
name = "swd-pet"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swd_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables `tauri::tray::{TrayIconBuilder, TrayIconEvent, ...}` used by
# `tray.rs` (Task 3 — system tray + context menu + left-click behavior).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform global cursor query. Used by window.rs's click-through poller
# to read the screen cursor position every ~30ms without going through the
# webview (which receives no pointer events while the window is in pass-through
# mode on Windows). Backed by Win32 `GetCursorPos` on Windows.
device_query = "1"
# Raw FFI bindings to Win32. Used by `activity.rs::idle_since` (Task 6) to
# call `GetLastInputInfo` (last user-input tick count) and read
# `LASTINPUTINFO`. Already a transitive dep (via tauri / webview2-com, at
# v0.61.x); promoted to a direct dep here so we can `use
# windows_sys::Win32::UI::Input::KeyboardAndMouse::*` without relying on a
# transitive's exact feature set. `GetTickCount64` is declared manually
# (one-line `extern "system"`) to avoid pulling in
# `Win32_System_SystemInformation` for a single call.
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# Task 8: agent backend skeleton (Backend trait / Session / types / factory).
# `async-trait` makes `Backend::execute` (an `async fn`) object-safe so the
# factory can return `Box<dyn Backend>` — Rust 1.97's native async-fn-in-trait
# is still not object-safe (`Box<dyn Backend>` won't compile). `async-trait`
# desugars `execute` to `Pin<Box<dyn Future + Send>>`, restoring object safety.
# `which` does cross-platform PATH lookup for `agent::exec::resolve`.
# `tokio` is already a transitive dep via Tauri but without the `process` /
# `macros` features we need here (subprocess spawn + `#[tokio::test]`); adding
# it as a direct dep with exactly those features unifies cleanly with Tauri's.
async-trait = "0.1"
which = "7"
tokio = { version = "1", features = ["process", "sync", "rt", "macros", "time"] }
# Task 13: conversation model — `Conversation::created_at` is a
# `chrono::DateTime<chrono::Utc>` so persisted conversations carry a
# human-readable, timezone-aware timestamp (Task 14 db / Task 15 chat read
# it back). chrono is already a transitive dep via Tauri (see Cargo.lock,
# 0.4.x); promoted to a direct dep with `serde` so `Conversation` derives
# `Serialize`/`Deserialize` and round-trips through the persistence layer.
chrono = { version = "0.4", features = ["serde"] }
# Task 14: portable SQLite store + TOML config. `rusqlite` with the
# `bundled` feature compiles SQLite from source (libsqlite3-sys), so the
# app needs no system SQLite install — the single .exe is self-contained.
# `toml` serializes the user-facing Config (theme / pet_pos / panel_rect
# / focus window / follow-activity interval) to a file next to the exe.
# `dirs` resolves the cross-platform %APPDATA% / XDG fallback location
# for the SQLite db + config when the exe dir is read-only (Program
# Files on Windows, /usr on Unix).
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
dirs = "5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
# Task 14: scratch directories for the db + config round-trip tests and
# the read-only fallback test (which `set_readonly(true)`s a temp exe_dir
# and asserts the db / config.toml land in a separate temp appdata dir).
tempfile = "3"
